version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aws-typing-challenge
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Change this before deploying to a real event!
      RESET_PASSWORD: RCB
    volumes:
      # Persist the SQLite database outside the container
      - typing_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  typing_data:
    driver: local
